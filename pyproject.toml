[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "1.0.0"
description = "Local-first agent orchestration framework with SQLite memory and MCP."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Agent OS Contributors" },
]
keywords = ["agents", "memory", "sqlite", "mcp", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2.0",
]
pinecone = [
    "pinecone-client>=9.0.0",
]
neo4j = [
    "neo4j>=5.20.0",
]
hindsight = [
    "hindsight-client>=0.4.22",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agent-os = "agent_os.cli:main"
"agent-os-mcp" = "agent_os.mcp_server:main"

[project.urls]
Homepage = "https://github.com/floridaKG/AgentOS-by-RegimeLab"
Repository = "https://github.com/floridaKG/AgentOS-by-RegimeLab"
Documentation = "https://github.com/floridaKG/AgentOS-by-RegimeLab/blob/main/docs/GETTING_STARTED.md"
Issues = "https://github.com/floridaKG/AgentOS-by-RegimeLab/issues"

[tool.setuptools]
packages = ["agent_os", "agent_os.resources"]
include-package-data = true

[tool.setuptools.package-data]
agent_os = ["resources/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
