name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-gate:
    name: Privacy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run privacy gate
        # Optional: set repo secret OWNER_USERNAME for extra owner-string scans.
        # Default HEAD scan uses generic patterns only (no private username in CI YAML).
        env:
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: bash tests/privacy/privacy_gate.sh .

  history-gate:
    name: History Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run history gate
        # Always scans secrets + private home-path patterns. Optional secret
        # OWNER_USERNAME adds an explicit maintainer-username scan.
        env:
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: bash tests/privacy/history_gate.sh .

  runtime-security:
    name: Runtime Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run runtime security tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/security/test_runtime_security.py

  acp-mock:
    name: ACP Mock Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run ACP mock test
        run: bash tests/smoke/acp_mock_test.sh .

  cold-boot:
    name: Cold Boot Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run cold boot smoke test
        env:
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
        run: bash tests/smoke/cold_boot.sh .

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run release gate
        env:
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash tests/smoke/release_gate.sh .

  clean-room:
    name: Clean-Room Install Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run clean-room install test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash tests/clean-room/install_and_verify.sh .

  git-archive-check:
    name: Git-Free Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create git archive and verify no .git directory
        run: |
          git archive HEAD -o /tmp/release-candidate.tar
          mkdir -p /tmp/verify
          tar xf /tmp/release-candidate.tar -C /tmp/verify
          if [ -d /tmp/verify/.git ]; then
            echo "FAIL: .git directory found in git archive"
            exit 1
          fi
          echo "PASS: Git archive is clean (no .git directory)"

  cli-mcp-check:
    name: CLI & MCP Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install mcp
          pip install pytest
      - name: Verify CLI entry points
        run: |
          echo "--- Verifying CLI entry points ---"
          for cmd in agent-os agent-os-mcp; do
            if [ -x "bin/$cmd" ]; then
              echo "  PASS: bin/$cmd"
            else
              echo "  FAIL: bin/$cmd not found or not executable"
              exit 1
            fi
          done
      - name: Verify CLI commands
        run: |
          echo "--- Verifying CLI commands ---"
          export PYTHONPATH="${{ github.workspace }}:${PYTHONPATH}"
          # Test agent-os CLI
          python3 -m agent_os --help | grep -q "Agent OS"
          echo "  PASS: agent-os CLI --help"
          # Test agent-os mcp subcommand
          python3 -m agent_os mcp --help | grep -q "MCP server operations"
          echo "  PASS: agent-os mcp --help"
      - name: Verify MCP server import
        run: |
          echo "--- Verifying MCP server ---"
          export PYTHONPATH="${{ github.workspace }}:${PYTHONPATH}"
          python3 -c "from agent_os.mcp_server import mcp; print('  PASS: MCP server imports successfully')"
      - name: Build distributable wheel
        run: |
          python3 -m pip install wheel
          python3 -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/agent-os-wheel
      - name: Run CLI tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m pytest tests/cli -q
