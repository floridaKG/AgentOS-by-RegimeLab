name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy-gate:
    name: Privacy Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Run privacy gate
        run: bash tests/privacy/privacy_gate.sh .

  clean-room:
    name: Clean-Room Install Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run clean-room install test
        run: bash tests/clean-room/install_and_verify.sh .
