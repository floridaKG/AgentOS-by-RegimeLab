# Critical Infrastructure Registry (Template)
# Source of truth for the regression-prevention checker.
#
# Each entry maps a critical surface to its role, callers, tests, and
# regression classes it protects against.
#
# The checker (bin/critical-change-check) reads this YAML and runs the
# listed tests when files matching an entry's path are staged or when
# --all is used.
#
# FORMAT:
#   path:               glob or literal path to the critical surface
#   role:               one-line description of what it does
#   callers:            scripts/binaries that depend on this surface
#   tests:              test commands that verify this surface's contract
#   regression_classes: which regression classes this protects
#
# CUSTOMIZE THIS FILE for your installation. Use $AGENT_OS_HOME to reference
# your Agent OS root. The checker reads this YAML at startup.
#
# Example entries below — replace with your own critical surfaces.

registry_version: "1.0"
