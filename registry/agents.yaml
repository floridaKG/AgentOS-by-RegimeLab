# Public Agent OS agents registry.
# Supported agent integrations for ACP dispatch.
# Last rebuilt: 2026-06-25

agents:
  - id: claude
    description: Anthropic Claude Code — strong reasoning, code review, orchestration
    invocation_template: claude -p "{{prompt}}" --model {{model}}
    role_strengths: [reasoning, review, orchestration]
    use_when: "Complex reasoning, code review, team coordination"

  - id: codex
    description: OpenAI Codex — deep code analysis, complex refactoring
    invocation_template: codex exec -m {{model}} --json -o {{out}} "{{prompt}}"
    role_strengths: [code archaeology, refactoring, analysis]
    use_when: "Deep code analysis, complex refactoring"

  - id: opencode
    description: OpenCode — lightweight agent host with multiple model support
    invocation_template: opencode run --model {{model}} --title {{title}} "{{prompt}}"
    role_strengths: [parallel exploration, fast review]
    use_when: "Cheap/free model hosting, parallel exploration"

  - id: cline
    description: Cline AI coding agent — live catalog, streaming, free model default
    invocation_template: acpx --model {{model}} cline exec "{{prompt}}"
    role_strengths: [cheap execution, parallel dispatch, tool-using tasks]
    provider: cline
    cost: free default / included model when explicitly selected
    transport: acpx → JSON-RPC relay → Cline --acp mode
    use_when: "Cheap/free model execution, streaming output, parallel tasks"
